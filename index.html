<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirmes</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 80%;
        }
        .button {
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
        }
        .button1 {
            background-color: rgb(255, 0, 43);
        }
        .button2 {
            background-color: rgb(255, 0, 157);
        }
        .button3 {
            background-color: rgb(82, 0, 235);
        }
        .button4 {
            background-color: rgb(0, 102, 255);
        }
        .button5 {
            background-color: rgb(0, 255, 136);
        }
        .button6 {
            background-color: rgb(0, 255, 21);
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <a href="/Kirmes/Rides/breakdancer-old" class="button button1">Breakdancer Old</a>
        <a href="/Kirmes/Rides/Shaker" class="button button2">Shaker</a>
        <a href="/Kirmes/Rides/Dom-Dancer/" class="button button3">Dom Dancer</a>
        <a href="/Kirmes/Rides/XXL/" class="button button4">Swing</a>
        <a href="/Kirmes/Rides/Booster/" class="button button5">Booster</a>
        <a href="/Kirmes/Rides/Capriolo/" class="button button6">Capriolo</a>
    </div>
</body>
</html>
